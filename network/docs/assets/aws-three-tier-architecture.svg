<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1760" viewBox="0 0 1600 1760" role="img" aria-labelledby="title description">
<title id="title">AWS three-tier architecture plan across two Availability Zones</title>
<desc id="description">One VPC, 10.0.0.0/16, contains two Availability Zones. Each has a public subnet with nodes of a shared public load balancer and its own NAT gateway; private web and application subnets with active replicas; and an isolated database subnet. One shared internal load balancer routes to application replicas. RDS has a primary in A, synchronous standby in B, and a shared DNS endpoint. Public default routes use the VPC internet gateway; private compute default routes use their own zone's NAT; database subnets have only local routes. Diagram is a proposed design, not a deployment.</desc>
<defs>
  <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#52647a"/></marker>
  <marker id="dbArrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 Z" fill="#93600b"/></marker>
</defs>
