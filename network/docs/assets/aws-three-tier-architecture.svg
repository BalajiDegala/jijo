<text x="800" y="1305" font-size="20" fill="#93600b" font-weight="600" text-anchor="middle">ONE RDS DNS ENDPOINT  ·  Both app replicas connect to the current primary  ·  TCP 5432 + TLS</text>
<text x="88" y="1364" font-size="19" fill="#52647a" font-weight="400" >One web Auto Scaling group + one application Auto Scaling group span both AZs. Start with one instance per tier per AZ.</text>
<text x="88" y="1396" font-size="19" fill="#52647a" font-weight="400" >The database uses one Multi-AZ DB instance deployment. The standby does not serve application reads before promotion.</text>
<rect x="64" y="1456" width="472" height="132" rx="14" fill="#edf5ff" stroke="#edf5ff"/>
<text x="86" y="1490" font-size="18" fill="#2163b4" font-weight="700" letter-spacing="0.6">PUBLIC SUBNETS</text>
<text x="86" y="1528" font-size="19" fill="#16283d" font-weight="600" >0.0.0.0/0 → Internet gateway</text>
<text x="86" y="1561" font-size="18" fill="#52647a" font-weight="400" >One shared public route table</text>
<rect x="560" y="1456" width="472" height="132" rx="14" fill="#f4effb" stroke="#f4effb"/>
<text x="582" y="1490" font-size="18" fill="#6d49a1" font-weight="700" letter-spacing="0.6">PRIVATE WEB + APP</text>
<text x="582" y="1528" font-size="19" fill="#16283d" font-weight="600" >0.0.0.0/0 → NAT in the same AZ</text>
<text x="582" y="1561" font-size="18" fill="#52647a" font-weight="400" >Separate private route table per AZ</text>
<rect x="1056" y="1456" width="480" height="132" rx="14" fill="#fff7e7" stroke="#fff7e7"/>
<text x="1078" y="1490" font-size="18" fill="#93600b" font-weight="700" letter-spacing="0.6">ISOLATED DATABASE</text>
<text x="1078" y="1528" font-size="19" fill="#16283d" font-weight="600" >10.0.0.0/16 → local only</text>
<text x="1078" y="1561" font-size="18" fill="#52647a" font-weight="400" >No internet default route</text>
<rect x="64" y="1610" width="1472" height="82" rx="14" fill="#16283d" stroke="#16283d"/>
<text x="88" y="1643" font-size="18" fill="#86dfcb" font-weight="700" letter-spacing="1">IF AZ A FAILS</text>
<text x="270" y="1643" font-size="21" fill="#fff" font-weight="600" >Healthy B web/app targets serve requests; RDS promotes B and updates the endpoint.</text>
<text x="270" y="1672" font-size="18" fill="#ccd8e7" font-weight="400" >Allow for detection, database reconnection, and recovery time. Size surviving capacity for the required traffic.</text>
<text x="64" y="1725" font-size="16" fill="#52647a" font-weight="400" >Plan only · Example CIDRs and private IPs · ALBs may select healthy targets in either zone · Public access is limited to the public ALB</text>
<text x="64" y="1748" font-size="15" fill="#52647a" font-weight="400" >Based on AWS architecture, VPC, ALB, Auto Scaling, and RDS documentation. Sources and implementation steps: docs/AWS_THREE_TIER_PLAN.md</text>
